name: CI

on:
  push:
    branches: [main, staging, prod]
  pull_request:
    branches: [main, staging, prod]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Django checks and tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DEBUG: "0"
      SECRET_KEY: ci-only-key-with-sufficient-length-and-entropy-not-for-production
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: app/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r app/requirements.txt
          python -m pip install ruff==0.12.9

      - name: Check Python correctness
        run: ruff check --select E9,F63,F7,F82 app

      - name: Compile Python modules
        run: python -m compileall -q app

      - name: Run Django checks
        working-directory: app
        run: |
          python manage.py check
          python manage.py check --deploy --fail-level ERROR

      - name: Run Bones tests
        working-directory: app
        env:
          DJANGO_SETTINGS_MODULE: config.test_settings
        run: python manage.py test bones.tests
