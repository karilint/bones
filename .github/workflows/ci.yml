name: CI

on:
  push:
    branches: [main, staging, prod]
  pull_request:
    branches: [main, staging, prod]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Django checks and tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DEBUG: "0"
      SECRET_KEY: ci-only-key-with-sufficient-length-and-entropy-not-for-production
      DJANGO_SETTINGS_MODULE: config.test_settings
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: |
            app/requirements.txt
            app/requirements-ci.txt

      - name: Install dependencies
        run: python -m pip install --require-hashes -r app/requirements-ci.txt

      - name: Check Python correctness
        run: ruff check --select E9,F63,F7,F82 app

      - name: Compile Python modules
        run: python -m compileall -q app

      - name: Run Django checks
        working-directory: app
        run: |
          python manage.py check
          python manage.py check --deploy --fail-level ERROR

      - name: Run Bones tests
        working-directory: app
        run: python manage.py test bones.tests

  container:
    name: Docker image build and tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DEBUG: "0"
      SECRET_KEY: ci-only-key-with-sufficient-length-and-entropy-not-for-production
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build application image
        run: docker build --tag bones-ci:${{ github.sha }} app

      - name: Verify container runtime
        run: docker run --rm bones-ci:${{ github.sha }} python --version

      - name: Run Bones tests in container
        run: >-
          docker run --rm
          --env DEBUG
          --env SECRET_KEY
          --env DJANGO_SETTINGS_MODULE=config.test_settings
          bones-ci:${{ github.sha }}
          python manage.py test bones.tests
