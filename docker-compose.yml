services:
  web:
    build:
      context: ./app
    command: sh ./scripts/entrypoint.sh
    ports:
      - "8000:8000"
      - "3000:3000"
    volumes:
      - ./app:/src/app
      - ./media:/vol/web/media
    env_file:
      - ./.env
    environment:
      MEDIA_ROOT: /vol/web/media
      STATIC_ROOT: /vol/web/static
      MSSQL_DRIVER: ODBC Driver 18 for SQL Server
      INITIALIZE_APP: "0"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/accounts/login/', timeout=5)"]
      interval: 15s
      timeout: 8s
      retries: 5
      start_period: 45s
